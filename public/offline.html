<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>অফলাইন — এসো কুরআন শিখি একাডেমি</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hind Siliguri", "Noto Sans Bengali", sans-serif;
      background: #fbfaf7;
      color: #134231;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: #186447;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 32px; height: 32px; stroke: #fff; }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #08251b;
    }
    p {
      font-size: 14px;
      color: #5b6b63;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #186447;
      border: none;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
    }
    button:active { background: #164f3a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"></path>
        <path d="M12 4H3v16h9"></path>
        <path d="M12 4v16"></path>
      </svg>
    </div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>এই মুহূর্তে আপনি অফলাইনে আছেন। ইন্টারনেট সংযোগ ফিরে এলে আবার চেষ্টা করুন — আগে দেখা পেজগুলো ততক্ষণে ক্যাশ থেকে খোলা যেতে পারে।</p>
    <button onclick="window.location.reload()">আবার চেষ্টা করুন</button>
  </div>
</body>
</html>
